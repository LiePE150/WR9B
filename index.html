<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quiz-Time – § 22 BBiG</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1a2940;-webkit-text-size-adjust:100%}button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}#app{max-width:850px;margin:0 auto;padding:18px 18px 32px}.top{background:#123457;color:white;padding:18px 20px;border-radius:16px;margin-bottom:18px}.top small{display:block;color:#bcefe5;letter-spacing:1px;font-weight:bold;margin-bottom:7px}.top h1{font-size:clamp(21px,4vw,30px);margin:0;line-height:1.25}.progress{height:9px;background:#d9e4ed;border-radius:10px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:#158d83}.panel{background:white;border:1px solid #dbe4ed;border-radius:16px;padding:24px;box-shadow:0 3px 12px rgba(18,52,87,.06)}.eyebrow{font-size:13px;font-weight:bold;color:#087e74;letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px}.question{font-size:clamp(20px,3.3vw,27px);line-height:1.35;font-weight:bold;margin:0 0 22px}.options{display:block}.option{display:-webkit-flex;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:15px 16px;margin:0 0 11px;background:#fff;border:2px solid #cbd8e5;border-radius:12px;color:#1a2940;text-align:left;font-size:17px;line-height:1.35}.option .letter{display:inline-block;min-width:34px;line-height:34px;text-align:center;background:#e8eff5;border-radius:9px;font-weight:bold;margin-right:12px;flex-shrink:0}.option.selected{border-color:#087e74;background:#e5f7f3}.option.right{border-color:#16925c;background:#e4f8eb}.option.wrong{border-color:#cc5151;background:#fff0ef}.option[disabled]{opacity:1;-webkit-text-fill-color:#1a2940}.action{background:#087e74;color:white;border:0;border-radius:12px;padding:16px 24px;min-height:54px;font-size:17px;font-weight:bold;max-width:100%;margin-top:16px}.action[disabled]{background:#a5b9b7;color:#f6f8f9}.secondary{background:#123457}.hint{color:#5a6b7d;font-size:15px;line-height:1.5}.feedback{padding:16px;margin-top:16px;border-radius:12px;background:#e6f7ee;border-left:5px solid #16925c;line-height:1.5}.feedback.bad{background:#fff0ef;border-left-color:#cc5151}.score{font-size:64px;font-weight:bold;color:#087e74;margin:10px 0}.result{border-top:1px solid #dbe4ed;padding:16px 0;line-height:1.55}.result:first-child{border-top:0}.good{color:#087c49}.badtext{color:#a93b3b}.bottom{margin-top:14px}.note{background:#edf4f8;padding:13px 15px;border-radius:10px;line-height:1.5}.review{margin-top:25px}@media(min-width:700px){#app{padding-top:32px}.panel{padding:32px}}@media(max-width:500px){#app{padding:10px 10px 25px}.top{padding:16px}.panel{padding:17px}.option{font-size:16px;min-height:62px}.action{width:100%}}</style></head><body><div id="app"><p>Quiz wird geladen …</p></div><script>
(function(){
'use strict';
var questions=[{"q":"Was gilt für die Kündigung eines Berufsausbildungsverhältnisses während der Probezeit?","multi":false,"a":["Nur mit einer Frist von vier Wochen","Jederzeit ohne Einhaltung einer Kündigungsfrist","Nur bei einem wichtigen Grund","Nur mit Zustimmung der Berufsschule"],"correct":[1],"why":"Während der Probezeit können beide Vertragsparteien jederzeit ohne Kündigungsfrist kündigen (§ 22 Abs. 1 BBiG). Die vorgeschriebene Schriftform bleibt bestehen."},{"q":"Lena befindet sich noch in der Probezeit. Ihr Ausbildungsbetrieb kündigt schriftlich, ohne einen Grund anzugeben. Wie ist das nach § 22 BBiG zu beurteilen?","multi":false,"a":["Die Kündigung ist wegen der fehlenden Begründung unwirksam.","Die Kündigung ist nur mit vierwöchiger Frist möglich.","Die Kündigung kann ohne Begründung und ohne Kündigungsfrist wirksam sein.","Die Kündigung ist erst nach Zustimmung der IHK wirksam."],"correct":[2],"why":"Während der Probezeit ist keine Angabe von Kündigungsgründen erforderlich. Die Kündigung muss aber schriftlich erfolgen und rechtzeitig zugehen."},{"q":"Welche Kündigungsmöglichkeiten sieht § 22 BBiG nach der Probezeit vor? Wähle alle richtigen Antworten.","multi":true,"a":["Beide Seiten können aus wichtigem Grund ohne Kündigungsfrist kündigen.","Auszubildende können mit vier Wochen Frist kündigen, wenn sie die Berufsausbildung aufgeben wollen.","Ausbildungsbetriebe können jederzeit mit vier Wochen Frist ordentlich kündigen.","Auszubildende können mit vier Wochen Frist kündigen, wenn sie sich für eine andere Berufstätigkeit ausbilden lassen wollen."],"correct":[0,1,3],"why":"Nach der Probezeit ist eine fristlose Kündigung aus wichtigem Grund möglich. Die ordentliche Kündigung mit vier Wochen Frist steht nach § 22 Abs. 2 Nr. 2 BBiG nur Auszubildenden für die genannten Berufswechsel- bzw. Aufgabegründe offen."},{"q":"Tom lernt Kaufmann für Büromanagement und möchte nach der Probezeit denselben Ausbildungsberuf lediglich in einem anderen Betrieb fortsetzen. Kann er sich dafür auf die Vierwochenfrist des § 22 Abs. 2 Nr. 2 BBiG berufen?","multi":false,"a":["Ja, jeder Betriebswechsel genügt.","Ja, wenn er den Wechsel per E-Mail ankündigt.","Nein, ein bloßer Betriebswechsel im selben Ausbildungsberuf reicht dafür nicht aus.","Ja, sofern die Berufsschule den Wechsel unterstützt."],"correct":[2],"why":"Die Vierwochenkündigung dient der Aufgabe der Berufsausbildung oder der Ausbildung für eine andere Berufstätigkeit – nicht allein dem Wechsel des Betriebs bei unverändertem Ausbildungsberuf. Eine einvernehmliche Aufhebung kann eine Alternative sein."},{"q":"Welche Form muss eine Kündigung des Berufsausbildungsverhältnisses nach § 22 BBiG haben?","multi":false,"a":["Eine mündliche Erklärung vor Zeugen reicht.","Eine E-Mail mit eingescannter Unterschrift reicht.","Eine Nachricht über das betriebliche Chatprogramm reicht.","Eine schriftliche Erklärung mit eigenhändiger Unterschrift ist erforderlich."],"correct":[3],"why":"§ 22 Abs. 3 BBiG verlangt die Schriftform und schließt die elektronische Form aus. Eine E-Mail oder Chatnachricht genügt nicht."},{"q":"Welche Aussagen zur Angabe von Kündigungsgründen sind richtig? Wähle alle richtigen Antworten.","multi":true,"a":["Bei einer Kündigung während der Probezeit muss nach § 22 BBiG kein Grund genannt werden.","Bei einer fristlosen Kündigung nach der Probezeit muss der Kündigungsgrund im Schreiben angegeben werden.","Bei der Vierwochenkündigung durch Auszubildende nach § 22 Abs. 2 Nr. 2 muss der Grund angegeben werden.","Bei jeder Kündigung genügt eine rein mündliche Begründung."],"correct":[0,1,2],"why":"Nach § 22 Abs. 3 BBiG müssen in den Fällen des Absatzes 2 die Kündigungsgründe angegeben werden. Für die Probezeit gilt diese Pflicht nicht. Eine mündliche Erklärung ersetzt nicht die erforderliche schriftliche Kündigung."},{"q":"Eine Ausbilderin erfährt von einem möglichen schweren Pflichtverstoß. Wann beginnt die Zweiwochenfrist für eine Kündigung aus wichtigem Grund grundsätzlich?","multi":false,"a":["Mit dem Beginn der Ausbildung","Mit der Kenntnis der maßgeblichen Tatsachen durch die kündigungsberechtigte Person","Mit dem nächsten Berufsschultag","Mit der Ausstellung des nächsten Zeugnisses"],"correct":[1],"why":"§ 22 Abs. 4 BBiG knüpft die Zweiwochenfrist an die Kenntnis der für die Kündigung maßgebenden Tatsachen durch die kündigungsberechtigte Person."},{"q":"Ein Ausbildungsbetrieb kennt die maßgeblichen Tatsachen für eine außerordentliche Kündigung seit mehr als zwei Wochen. Eine erforderliche Schlichtung wurde nicht eingeleitet. Was gilt nach § 22 Abs. 4 BBiG?","multi":false,"a":["Eine darauf gestützte Kündigung aus wichtigem Grund ist unwirksam.","Die Kündigungsfrist verlängert sich automatisch auf vier Wochen.","Die Kündigung ist ohne Einschränkung weiterhin möglich.","Eine mündliche Kündigung genügt jetzt."],"correct":[0],"why":"Die Kündigung aus wichtigem Grund ist unwirksam, wenn die maßgeblichen Tatsachen der kündigungsberechtigten Person länger als zwei Wochen bekannt sind. Bei einem eingeleiteten vorgesehenen Güteverfahren kann der Fristlauf gehemmt sein."},{"q":"Nach der Probezeit möchte ein Ausbildungsbetrieb einem Azubi wegen wiederholten Zuspätkommens fristlos kündigen. Welche Aussage trifft zu?","multi":false,"a":["Jedes Zuspätkommen ist automatisch ein wichtiger Grund.","Der Betrieb darf immer mit vier Wochen Frist ordentlich kündigen.","Es muss geprüft werden, ob im Einzelfall ein wichtiger Grund vorliegt; häufig ist vorher eine Abmahnung erforderlich.","Eine Begründung im Kündigungsschreiben ist nicht notwendig."],"correct":[2],"why":"Nicht jedes Fehlverhalten rechtfertigt eine fristlose Kündigung. Entscheidend sind Schwere, Umstände und Verhältnismäßigkeit; bei steuerbarem Verhalten ist regelmäßig eine einschlägige Abmahnung erforderlich."},{"q":"Mia möchte nach der Probezeit ihre Ausbildung zur Verkäuferin aufgeben und stattdessen eine Ausbildung zur Pflegefachfrau beginnen. Welche Aussagen treffen zu? Wähle alle richtigen Antworten.","multi":true,"a":["Sie kann grundsätzlich mit einer Frist von vier Wochen kündigen.","Sie muss die Kündigung schriftlich erklären.","Sie muss den Kündigungsgrund im Kündigungsschreiben angeben.","Sie kann die Kündigung wirksam ausschließlich per WhatsApp erklären."],"correct":[0,1,2],"why":"Ein Wechsel zu einer anderen Berufstätigkeit ist von § 22 Abs. 2 Nr. 2 BBiG erfasst. Es gelten vier Wochen Kündigungsfrist, Schriftform und die Pflicht zur Angabe des Kündigungsgrundes."}];
var app=document.getElementById('app');
var index=-1, picks=[], checked=false, results=[];
function escapeHTML(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function contains(a,n){return a.indexOf(n)!==-1;}
function same(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(!contains(b,a[i]))return false;return true;}
function button(label,action,disabled,extra){return '<button type="button" class="action '+(extra||'')+'" data-action="'+action+'"'+(disabled?' disabled="disabled"':'')+'>'+label+'</button>';}
function shell(label,pct,content){app.innerHTML='<div class="top"><small>QUIZ-TIME · WIRTSCHAFT UND RECHT</small><h1>§ 22 BBiG · Kündigung des Ausbildungsverhältnisses</h1></div><div class="progress" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div><main class="panel"><div class="eyebrow">'+label+'</div>'+content+'</main>';}
function render(){
 if(index===-1){shell('Interaktives Quiz · 10 Fragen',0,'<h2 class="question">Bist du fit bei der Kündigung eines Ausbildungsverhältnisses?</h2><p class="hint">10 Wissens- und Praxisfragen. Bei einigen Fragen sind mehrere Antworten richtig.</p><p class="note">Du erhältst nach jeder Frage eine Erklärung und am Ende deine persönliche Auswertung. Es werden keine Ergebnisse verschickt.</p>'+button('Quiz starten','start',false));return;}
 if(index>=questions.length){var score=0,i,r,body='';for(i=0;i<results.length;i++)if(results[i].ok)score++;
 body='<h2 class="question">Deine persönliche Auswertung</h2><div class="score">'+score+' / '+questions.length+'</div><p><strong>'+Math.round(score/questions.length*100)+' % richtig</strong> · Jede vollständig richtige Frage zählt einen Punkt.</p><p class="hint">'+(score===10?'Ausgezeichnet!':score>=8?'Sehr gut gemacht!':score>=6?'Gute Grundlage!':'Weiter üben lohnt sich!')+'</p><div class="review">';
 for(i=0;i<questions.length;i++){r=results[i];body+='<div class="result"><strong class="'+(r.ok?'good':'badtext')+'">'+(r.ok?'✓ Richtig':'✕ Nicht richtig')+'</strong><p><b>'+(i+1)+'. '+escapeHTML(questions[i].q)+'</b></p><p class="hint">Deine Antwort: '+r.chosen.map(function(x){return 'ABCD'.charAt(x);}).join(', ')+'<br>Richtige Antwort: '+questions[i].correct.map(function(x){return 'ABCD'.charAt(x);}).join(', ')+'</p><p>'+escapeHTML(questions[i].why)+'</p></div>';}
 body+='</div>'+button('Quiz erneut starten','start',false,'secondary');shell('Ergebnis',100,body);return;}
 var q=questions[index],body='<h2 class="question">'+escapeHTML(q.q)+'</h2><p class="hint">'+(q.multi?'Mehrfachauswahl: Wähle alle richtigen Antworten.':'Einfachauswahl: Wähle eine Antwort.')+'</p><div class="options">';
 for(var j=0;j<q.a.length;j++){var cl=checked?(contains(q.correct,j)?' right':contains(picks,j)?' wrong':''):(contains(picks,j)?' selected':'');body+='<button type="button" class="option'+cl+'" data-pick="'+j+'" aria-pressed="'+(contains(picks,j)?'true':'false')+'"'+(checked?' disabled="disabled"':'')+'><span class="letter">'+'ABCD'.charAt(j)+'</span><span>'+escapeHTML(q.a[j])+'</span></button>';}
 body+='</div>';
 if(checked){var ok=results[index].ok;body+='<div class="feedback'+(ok?'':' bad')+'" role="status"><b>'+(ok?'Richtig!':'Noch nicht richtig.')+'</b> '+escapeHTML(q.why)+'</div>'+button(index===questions.length-1?'Auswertung anzeigen':'Nächste Frage','next',false);}else{body+=button('Antwort überprüfen','verify',picks.length===0);}
 shell('Frage '+(index+1)+' von '+questions.length,Math.round((index+1)/questions.length*100),body);
}
function act(a,n){if(a==='start'){index=0;picks=[];checked=false;results=[];render();return;}
 if(a==='pick'&&!checked){var q=questions[index];if(q.multi){if(contains(picks,n)){picks.splice(picks.indexOf(n),1);}else{picks.push(n);}}else{picks=[n];}render();return;}
 if(a==='verify'&&!checked&&picks.length){checked=true;results.push({ok:same(picks,questions[index].correct),chosen:picks.slice(0)});render();return;}
 if(a==='next'&&checked){index++;picks=[];checked=false;render();window.scrollTo(0,0);}}
 app.addEventListener('click',function(e){var node=e.target;while(node&&node!==app){if(node.getAttribute){var p=node.getAttribute('data-pick'),a=node.getAttribute('data-action');if(p!==null){act('pick',parseInt(p,10));return;}if(a){act(a);return;}}node=node.parentNode;}},false);
 render();
})();</script></body></html>
